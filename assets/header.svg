<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="title desc">
  <title id="title">Kintsugi — Multimodal AI</title>
  <desc id="desc">An ink-blue banner with warm gold seams. From models to agents: SFT and RL, prompt design, and agent systems.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111b29" />
      <stop offset="1" stop-color="#202d3b" />
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#9c783d" />
      <stop offset="0.5" stop-color="#ecd39b" />
      <stop offset="1" stop-color="#b99150" />
    </linearGradient>
    <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M36 0H0V36" fill="none" stroke="#d8e0e8" stroke-opacity="0.035" />
    </pattern>
  </defs>
  <rect width="1200" height="300" rx="18" fill="url(#bg)" />
  <rect width="1200" height="300" rx="18" fill="url(#grid)" />
  <path d="M970 -12 936 50 979 90 926 142 961 190 901 249 918 312M979 90 1055 113 1094 155 1207 173M926 142 856 161 824 208" fill="none" stroke="url(#gold)" stroke-width="2.4" stroke-linejoin="round" />
  <path d="M1039 -10 1009 48 1052 80 1035 108M961 190 1026 215 1073 286" fill="none" stroke="#c5a46a" stroke-opacity="0.4" stroke-width="1" />
  <circle cx="979" cy="90" r="4.5" fill="#ecd39b" />
  <circle cx="926" cy="142" r="3" fill="#ecd39b" />
  <circle cx="961" cy="190" r="3" fill="#ecd39b" />
  <text x="56" y="60" fill="#d9bd85" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="5">KINTSUGI / MULTIMODAL AI</text>
  <text x="53" y="139" fill="#f5f2eb" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="-1.5">From models to agents.</text>
  <text x="56" y="180" fill="#b7c3cf" font-family="Arial, Helvetica, sans-serif" font-size="20">Exploring practical applications of multimodal models.</text>
  <path d="M56 216H106" stroke="#d9bd85" stroke-width="2" />
  <text x="56" y="254" fill="#d7dfe7" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">SFT / RL</text>
  <circle cx="159" cy="249" r="2" fill="#c2a675" />
  <text x="180" y="254" fill="#d7dfe7" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">PROMPT DESIGN</text>
  <circle cx="356" cy="249" r="2" fill="#c2a675" />
  <text x="377" y="254" fill="#d7dfe7" font-family="Arial, Helvetica, sans-serif" font-size="15" letter-spacing="1.2">AGENT SYSTEMS</text>
